<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Monad-style tilted rounded square as scope lens -->
  <rect x="7" y="7" width="36" height="36" rx="10" ry="10"
        stroke="#6366f1" stroke-width="3.5" fill="none"
        transform="rotate(45 25 25)"/>
  <!-- Graph edges (behind nodes) -->
  <line x1="17" y1="20" x2="31" y2="17" stroke="#6366f1" stroke-width="2" opacity="0.35"/>
  <line x1="17" y1="20" x2="25" y2="33" stroke="#6366f1" stroke-width="2" opacity="0.35"/>
  <line x1="31" y1="17" x2="25" y2="33" stroke="#7c3aed" stroke-width="2" opacity="0.35"/>
  <!-- Graph nodes -->
  <circle cx="17" cy="20" r="4.5" fill="#6366f1"/>
  <circle cx="31" cy="17" r="4" fill="#7c3aed"/>
  <circle cx="25" cy="33" r="3.5" fill="#a78bfa"/>
  <!-- Scope handle (from bottom-right corner of the tilted square) -->
  <line x1="44" y1="44" x2="58" y2="58" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
</svg>
