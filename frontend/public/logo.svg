<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Scope ring -->
  <circle cx="26" cy="26" r="21" stroke="#6366f1" stroke-width="3.5" fill="none"/>
  <!-- Graph edges (behind nodes) -->
  <line x1="18" y1="22" x2="32" y2="18" stroke="#6366f1" stroke-width="2" opacity="0.35"/>
  <line x1="18" y1="22" x2="28" y2="34" stroke="#6366f1" stroke-width="2" opacity="0.35"/>
  <line x1="32" y1="18" x2="28" y2="34" stroke="#7c3aed" stroke-width="2" opacity="0.35"/>
  <!-- Graph nodes -->
  <circle cx="18" cy="22" r="5" fill="#6366f1"/>
  <circle cx="32" cy="18" r="4.5" fill="#7c3aed"/>
  <circle cx="28" cy="34" r="4" fill="#a78bfa"/>
  <!-- Scope handle -->
  <line x1="42" y1="42" x2="58" y2="58" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
</svg>
