<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Monad outer — superellipse (squircle) with bulging edges, rotated 45° -->
  <path d="M25 0 C38 0, 50 12, 50 25 C50 38, 38 50, 25 50 C12 50, 0 38, 0 25 C0 12, 12 0, 25 0Z"
        fill="#6366f1"
        transform="rotate(45 25 25)"/>
  <!-- Monad inner — white squircle, rotated 50° (more clockwise) -->
  <path d="M25 9 C32 9, 41 18, 41 25 C41 32, 32 41, 25 41 C18 41, 9 32, 9 25 C9 18, 18 9, 25 9Z"
        fill="white"
        transform="rotate(50 25 25)"/>
  <!-- Graph edges (behind nodes) -->
  <line x1="18" y1="21" x2="30" y2="19" stroke="#6366f1" stroke-width="1.8" opacity="0.3"/>
  <line x1="18" y1="21" x2="25" y2="31" stroke="#6366f1" stroke-width="1.8" opacity="0.3"/>
  <line x1="30" y1="19" x2="25" y2="31" stroke="#7c3aed" stroke-width="1.8" opacity="0.3"/>
  <!-- Graph nodes -->
  <circle cx="18" cy="21" r="4" fill="#6366f1"/>
  <circle cx="30" cy="19" r="3.5" fill="#7c3aed"/>
  <circle cx="25" cy="31" r="3" fill="#a78bfa"/>
  <!-- Scope handle -->
  <line x1="44" y1="44" x2="58" y2="58" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
</svg>
