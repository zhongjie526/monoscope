<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Monad-style squircle scope (rounded square) -->
  <rect x="5" y="5" width="40" height="40" rx="12" ry="12" stroke="#6366f1" stroke-width="3.5" fill="none"/>
  <!-- Graph edges (behind nodes) -->
  <line x1="16" y1="20" x2="32" y2="16" stroke="#6366f1" stroke-width="2" opacity="0.35"/>
  <line x1="16" y1="20" x2="26" y2="34" stroke="#6366f1" stroke-width="2" opacity="0.35"/>
  <line x1="32" y1="16" x2="26" y2="34" stroke="#7c3aed" stroke-width="2" opacity="0.35"/>
  <!-- Graph nodes -->
  <circle cx="16" cy="20" r="4.5" fill="#6366f1"/>
  <circle cx="32" cy="16" r="4" fill="#7c3aed"/>
  <circle cx="26" cy="34" r="3.5" fill="#a78bfa"/>
  <!-- Scope handle -->
  <line x1="42" y1="42" x2="58" y2="58" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
</svg>
