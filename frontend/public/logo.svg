<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Monad outer diamond — corners are sharp-ish, sides curve slightly inward -->
  <path d="M25 2 C29 8, 42 8, 48 25 C42 42, 29 42, 25 48 C21 42, 8 42, 2 25 C8 8, 21 8, 25 2Z"
        fill="#836EF9"
        transform="rotate(0 25 25)"/>
  <!-- Monad inner cutout — tilted more clockwise, same concave shape -->
  <path d="M25 12 C27 15, 34 15, 38 25 C34 35, 27 35, 25 38 C23 35, 16 35, 12 25 C16 15, 23 15, 25 12Z"
        fill="white"
        transform="rotate(8 25 25)"/>
  <!-- Graph edges -->
  <line x1="19" y1="22" x2="29" y2="20" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>
  <line x1="19" y1="22" x2="25" y2="30" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>
  <line x1="29" y1="20" x2="25" y2="30" stroke="#7c3aed" stroke-width="1.5" opacity="0.35"/>
  <!-- Graph nodes -->
  <circle cx="19" cy="22" r="3.5" fill="#6366f1"/>
  <circle cx="29" cy="20" r="3" fill="#7c3aed"/>
  <circle cx="25" cy="30" r="2.5" fill="#a78bfa"/>
  <!-- Scope handle -->
  <line x1="44" y1="44" x2="58" y2="58" stroke="#836EF9" stroke-width="5" stroke-linecap="round"/>
</svg>
