<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
  <!-- Outer — Monad purple rounded diamond -->
  <rect x="5" y="5" width="36" height="36" rx="8" ry="8"
        fill="#836EF9"
        transform="rotate(45 23 23)"/>
  <!-- Inner — white rounded diamond, tilted 8° more clockwise -->
  <rect x="11" y="11" width="24" height="24" rx="5" ry="5"
        fill="white"
        transform="rotate(53 23 23)"/>
  <!-- Graph edges -->
  <line x1="17" y1="20" x2="27" y2="18" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>
  <line x1="17" y1="20" x2="23" y2="28" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>
  <line x1="27" y1="18" x2="23" y2="28" stroke="#7c3aed" stroke-width="1.5" opacity="0.35"/>
  <!-- Graph nodes -->
  <circle cx="17" cy="20" r="3.5" fill="#6366f1"/>
  <circle cx="27" cy="18" r="3" fill="#7c3aed"/>
  <circle cx="23" cy="28" r="2.5" fill="#a78bfa"/>
</svg>
